name: CForge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Clojure tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CForge
        uses: actions/checkout@v6

      - name: Checkout Forge build system
        uses: actions/checkout@v6
        with:
          repository: nickik/forge
          path: .forge-toolchain

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          java --version
          clojure -Sdescribe

      - name: Resolve dependencies
        run: clojure -P -M:test

      - name: Run unit tests
        run: clojure -M:test

      - name: Smoke-test CLI AST
        run: clojure -M:native -- --ast --pprint harness/fixtures/smoke/arithmetic.fg

      - name: Run Forge package tests with Clojure driver
        run: |
          cargo run --quiet \
            --manifest-path .forge-toolchain/Cargo.toml \
            -p forge-build --bin forge -- \
            test --manifest-path forge.fdn \
            --driver clojure \
            --driver-arg -M:native \
            --driver-arg --

      - name: Run Forge CKV through Clojure driver
        shell: bash
        run: |
          set -euo pipefail
          DB="$(mktemp)"
          cleanup() { rm -f "$DB" "$DB.lock"; }
          trap cleanup EXIT

          run_ckv() {
            local output status
            set +e
            output="$(cargo run --quiet \
              --manifest-path .forge-toolchain/Cargo.toml \
              -p forge-build --bin forge -- \
              run --manifest-path .forge-toolchain/examples/ckv/forge.fdn \
              --target ckv \
              --driver clojure \
              --driver-arg -M:native \
              --driver-arg -- \
              -- "$@")"
            status=$?
            set -e
            if [[ $status -ne 0 ]]; then
              printf '%s\n' "$output" >&2
              return "$status"
            fi
            printf '%s\n' "$output"
          }

          SET1="$(run_ckv --database-file "$DB" set test 5)"
          echo "$SET1" | grep -Eq '^access: [0-9]+ us$'

          GET1="$(run_ckv --database-file "$DB" get test)"
          test "$(printf '%s\n' "$GET1" | sed -n '1p')" = "5"
          printf '%s\n' "$GET1" | sed -n '2p' | grep -Eq '^access: [0-9]+ us$'

          SET2="$(run_ckv --database-file "$DB" set test 7)"
          echo "$SET2" | grep -Eq '^access: [0-9]+ us$'

          GET2="$(run_ckv --database-file "$DB" get test)"
          test "$(printf '%s\n' "$GET2" | sed -n '1p')" = "7"
          test "$(wc -l < "$DB")" -eq 2

  native-image:
    name: GraalVM native image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout CForge
        uses: actions/checkout@v6

      - name: Checkout Forge build system
        uses: actions/checkout@v6
        with:
          repository: nickik/forge
          path: .forge-toolchain

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          java --version
          native-image --version
          clojure -Sdescribe

      - name: Build native executable
        run: bash bin/build-native.sh

      - name: Verify native executable through Forge build system
        run: |
          test -x target/cforge
          cargo run --quiet \
            --manifest-path .forge-toolchain/Cargo.toml \
            -p forge-build --bin forge -- \
            test --manifest-path forge.fdn \
            --driver ./target/cforge

      - name: Run Forge CKV through native CForge
        shell: bash
        run: |
          set -euo pipefail
          DB="$(mktemp)"
          cleanup() { rm -f "$DB" "$DB.lock"; }
          trap cleanup EXIT

          run_ckv() {
            local output status
            set +e
            output="$(cargo run --quiet \
              --manifest-path .forge-toolchain/Cargo.toml \
              -p forge-build --bin forge -- \
              run --manifest-path .forge-toolchain/examples/ckv/forge.fdn \
              --target ckv \
              --driver ./target/cforge \
              -- "$@")"
            status=$?
            set -e
            if [[ $status -ne 0 ]]; then
              printf '%s\n' "$output" >&2
              return "$status"
            fi
            printf '%s\n' "$output"
          }

          SET1="$(run_ckv --database-file "$DB" set test 5)"
          echo "$SET1" | grep -Eq '^access: [0-9]+ us$'

          GET1="$(run_ckv --database-file "$DB" get test)"
          test "$(printf '%s\n' "$GET1" | sed -n '1p')" = "5"
          printf '%s\n' "$GET1" | sed -n '2p' | grep -Eq '^access: [0-9]+ us$'

          SET2="$(run_ckv --database-file "$DB" set test 7)"
          echo "$SET2" | grep -Eq '^access: [0-9]+ us$'

          GET2="$(run_ckv --database-file "$DB" get test)"
          test "$(printf '%s\n' "$GET2" | sed -n '1p')" = "7"
          test "$(wc -l < "$DB")" -eq 2

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: cforge-linux-x64
          path: target/cforge
          if-no-files-found: error
